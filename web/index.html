<meta charset="utf-8">
<title>나만의 부산 노선도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-screen canvas map, zoom buttons top-right, and a bottom sheet with the
   route chips (any number can be on) and the focused route's stop list, which swipes away. */
:root {
  /* map colours: fixed in both themes (the map itself is the user's spec) */
  --land: #F8F3E3;
  --land-edge: #E2D7BA;
  --sea: #CFE6F3;
  --shallow: #E4F2FA;
  --bus: #C2E66A;
  --bus-ink: #557A1C;
  --bus-text: #2C430B;
  --line1: #F06A00;
  --line2: #81BF48;
  --line3: #BB8C00;
  --label: #3A372E;
  --commute: #D9483B;
  /* interface chrome */
  --panel: rgba(255, 253, 247, 0.95);
  --ink: #2B2A24;
  --ink-soft: #6E6A5C;
  --rule: #E7E0CC;
  --chip: #F2EDDD;
  --chip-on: #2B2A24;
  --chip-on-ink: #FFFDF7;
  --grab: #CFC7B1;
  --focus: #557A1C;
  --shadow: 0 6px 24px rgba(52, 46, 25, 0.16);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(30, 31, 28, 0.93);
    --ink: #F1EDE0;
    --ink-soft: #ABA694;
    --rule: #3A3A33;
    --chip: #2C2D28;
    --chip-on: #F1EDE0;
    --chip-on-ink: #1E1F1C;
    --grab: #55554B;
    --focus: #C2E66A;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(30, 31, 28, 0.93);
  --ink: #F1EDE0;
  --ink-soft: #ABA694;
  --rule: #3A3A33;
  --chip: #2C2D28;
  --chip-on: #F1EDE0;
  --chip-on-ink: #1E1F1C;
  --grab: #55554B;
  --focus: #C2E66A;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--sea);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
}
#app { position: relative; height: 100%; }
#map {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; cursor: grab;
}
#map.dragging { cursor: grabbing; }

.zoom {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
  background: var(--panel);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.zoom button {
  width: 40px; height: 40px; border: 0; background: transparent;
  color: var(--ink); font: 600 20px/1 var(--font); cursor: pointer;
}
.zoom button + button { border-top: 1px solid var(--rule); }
.zoom button.fit { font-size: 11px; white-space: nowrap; letter-spacing: -0.03em; }
.zoom button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.zoom button:focus-visible, .chip:focus-visible, .stop-row:focus-visible, .close:focus-visible, .grab:focus-visible {
  outline: 2px solid var(--focus); outline-offset: -2px;
}

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; flex-direction: column;
  max-height: 42%;
  overflow: hidden;
  transition: max-height 0.25s ease;
  overscroll-behavior: contain;
}
/* route chips: one fixed-height row that only scrolls sideways */
.chips {
  flex: none;
  height: 54px;
  display: flex; align-items: center; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  touch-action: pan-x;
  overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border-radius: 999px; border: 0;
  background: var(--chip); color: var(--ink);
  font: 600 13px/1 var(--font);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip .sw.bus { background: var(--bus); box-shadow: inset 0 0 0 1.5px var(--bus-ink); border-radius: 3px; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip.sep { margin-left: 4px; }

.detail {
  -webkit-user-select: none; user-select: none;
  border-top: 1px solid var(--rule);
  display: flex; flex-direction: column;
  min-height: 0;
}
.grab {
  flex: none; align-self: center;
  width: 100%; height: 18px; border: 0; background: transparent; cursor: grab;
  display: grid; place-items: center;
  touch-action: none;
}
.grab::before { content: ""; width: 38px; height: 4px; border-radius: 2px; background: var(--grab); }
.detail-head {
  display: flex; align-items: flex-start; gap: 10px;
  padding-block: 0 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none;
}
.badge {
  flex: none;
  min-width: 40px; height: 28px; padding: 0 8px;
  border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 14px/1 var(--font);
  font-variant-numeric: tabular-nums;
}
.badge.bus { background: var(--bus); color: var(--bus-text); box-shadow: inset 0 0 0 1.5px var(--bus-ink); }
.badge.sub { color: #fff; border-radius: 999px; min-width: 28px; }
.detail-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.detail-text strong { font-size: 14.5px; font-weight: 600; text-wrap: balance; }
.detail-text span { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.close {
  flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--chip); color: var(--ink); font: 500 18px/1 var(--font); cursor: pointer;
}
.sheet.full { max-height: calc(100% - 8px - env(safe-area-inset-top, 0px)); height: calc(100% - 8px - env(safe-area-inset-top, 0px)); }
.sheet.full .detail { flex: 1; }
/* in the half-height sheet the list does not scroll: a swipe up opens it full screen */
.sheet:not(.full) .stops { overflow-y: hidden; touch-action: none; }
.sheet.full .stops { touch-action: pan-y; }
.stops {
  list-style: none; margin: 0;
  padding-block: 0 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
  min-height: 0;
}
.stop-row {
  display: grid; grid-template-columns: 28px 14px 1fr; align-items: center; gap: 8px;
  width: 100%; border: 0; background: transparent; color: var(--ink);
  padding: 6px 0; text-align: left; cursor: pointer;
  font: 400 13.5px/1.35 var(--font);
}
.stop-row .idx { color: var(--ink-soft); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
.stop-row .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--bus-ink); justify-self: center; }
.stop-row.major .name { font-weight: 600; }
.stop-row.end .dot { background: var(--bus-ink); }
.stop-row.commute .dot { background: var(--commute); box-shadow: inset 0 0 0 2px #fff, 0 0 0 1.5px var(--commute); }
.stop-row .tag { margin-left: 6px; font-size: 11px; color: var(--bus-ink); font-weight: 600; }
.stop-row .tag.c { color: var(--commute); }
.stop-row .xfer { margin-left: 6px; font-size: 11px; color: var(--ink-soft); }
.hint {
  margin: 0;
  padding-block: 0 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 12px; color: var(--ink-soft);
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
}
.hint .key { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 500; }
.hint .key::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--commute); box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--commute); }
.hint a { color: var(--ink-soft); }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; color: #557A1C; pointer-events: none;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <canvas id="map" aria-label="부산 지도: 도시철도 1·2·3호선과 버스 금정7, 77, 100-1, 80, 31, 189, 10, 144, 111-1번 노선" role="img"></canvas>
  <div class="loading" id="loading">지도 불러오는 중…</div>

  <div class="zoom" role="group" aria-label="지도 확대·축소">
    <button type="button" id="zoom-in" aria-label="확대">+</button>
    <button type="button" id="zoom-out" aria-label="축소">−</button>
    <button type="button" id="zoom-fit" class="fit" aria-label="전체 보기">전체</button>
    <button type="button" id="all-stops" class="fit" aria-pressed="false" aria-label="모든 정류장 보기">정류장</button>
  </div>

  <section class="sheet" aria-label="노선">
    <div class="chips" id="chips" role="toolbar" aria-label="노선 선택 (여러 개 선택 가능)"></div>
    <div class="detail" id="detail" hidden>
      <button type="button" class="grab" id="grab" aria-label="정류장 목록 접기"></button>
      <div class="detail-head" id="detail-head">
        <span class="badge" id="d-badge"></span>
        <div class="detail-text">
          <strong id="d-title"></strong>
          <span id="d-sub"></span>
        </div>
        <button type="button" class="close" id="d-close" aria-label="선택 모두 해제">×</button>
      </div>
      <ol class="stops" id="d-stops"></ol>
    </div>
    <p class="hint" id="hint">
      <span class="key">출근길 정류장</span>
      <a href="https://claude.ai/artifact/CKcUTudZuw55rrebUj5sCA" target="_blank" rel="noopener">과외 출퇴근길</a>
      <a href="https://claude.ai/artifact/AW6kDhbaxxutPa3r9nwZZB" target="_blank" rel="noopener">DYB 알바 버스 약도</a>
      <span>· 다른 정류장은 오른쪽 위 ‘정류장’</span>
    </p>
  </section>
</div>

<script>
(() => {
  const css = getComputedStyle(document.documentElement);
  const C = name => css.getPropertyValue(name).trim();
  const COL = {
    land: C('--land'), edge: C('--land-edge'), sea: C('--sea'), shallow: C('--shallow'),
    bus: C('--bus'), busInk: C('--bus-ink'), busText: C('--bus-text'), label: C('--label'),
    commute: C('--commute'),
    sub: { '1': C('--line1'), '2': C('--line2'), '3': C('--line3') },
  };
  const FONT = C('--font');

  // Stops from the two commute pages (과외 출퇴근길, DYB 알바 버스 약도), with what happens there.
  // name -> what happens there, and the routes it is used for (to pick the right pole)
  const COMMUTE = {
    '장전중앙교회': ['100-1 · 77 승차', ['100-1', '77']],
    '엘지아파트': ['과외 · 100-1', ['100-1']],
    '연산역.연산교차로': ['100-1 하차 → 1호선', ['100-1']],
    '부산대역': ['금정7 승차', ['금정7']],
    '새벽벌도서관.상남국제회관': ['금정7 하차 · 기숙사', ['금정7']],
    '부산대학교정문': ['80 · 144 · 111-1 하차', ['80', '144', '111-1']],
    '부산은행': ['금정7 승차', ['금정7']],
    '사직운동장': ['80 승차', ['80']],
    '부전교회': ['77 · 31 · 189 · 10 환승', ['77', '31', '189', '10']],
    '화신아파트': ['189 · 10 승차 · 학원 가는 길', ['189', '10']],
    '대선주조': ['189 · 10 · 학원 가는 길', ['189', '10']],
    '여명중학교': ['189 · 10 승하차 · DYB', ['189', '10']],
    '동래역': ['189 하차 → 144 · 111-1 승차', ['189', '144', '111-1']],
    '서부시외버스터미널.사상역': ['31 하차', ['31']],
  };

  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  let D = null, P = {};
  let W = 0, H = 0, DPR = 1;
  const view = { cx: 0, cy: 0, s: 1 };
  let fitScale = 1;
  const sel = [];               // selected keys in order: 'bus:77', 'sub:1'
  let sheetState = 'normal';    // stop list: 'normal' (half), 'full' (full screen), 'hidden'
  let allStops = false;         // show every stop, not only the ones I use
  let hiQ = 0;

  fetch('map-data.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(init)
    .catch(err => {
      document.getElementById('loading').textContent = '지도 데이터를 불러오지 못했습니다. 새로고침해 보세요. (' + err.message + ')';
    });

  function init(data) {
    D = data;
    P.land = new Path2D(D.land);
    P.sub = {};
    for (const k of Object.keys(D.subway)) P.sub[k] = new Path2D(D.subway[k].d);
    P.bus = {};
    for (const b of D.buses) P.bus[b.no] = new Path2D(b.d);
    D.stops.forEach(s => {
      s.r = s.r || [];
      // a commute stop is named in COMMUTE and served by one of the routes it mentions
      const m = COMMUTE[s.n];
      s.c = m && s.r.some(r => m[1].includes(r)) ? m[0] : null;
    });
    document.getElementById('loading').hidden = true;
    buildChips();
    resize();
    fit(false);
    draw(true);
  }

  // ---------- selection helpers ----------
  const isOn = key => sel.includes(key);
  const selBuses = () => sel.filter(k => k.startsWith('bus:')).map(k => k.slice(4));
  const selSubs = () => sel.filter(k => k.startsWith('sub:')).map(k => k.slice(4));
  const focusKey = () => sel[sel.length - 1] || null;

  // ---------- view ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  }
  const sheetH = () => document.querySelector('.sheet').getBoundingClientRect().height;
  function extent(points) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of points) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    return [x0, y0, x1, y1];
  }
  function allPoints() {
    const pts = D.stops.map(s => [s.x, s.y]);
    for (const k in D.subway) for (const p of D.subway[k].samples) pts.push(p);
    return pts;
  }
  function selPoints() {
    const pts = [];
    for (const no of selBuses()) {
      const b = D.buses.find(x => x.no === no);
      for (const p of b.samples) pts.push(p);
      for (const i of b.stops) pts.push([D.stops[i].x, D.stops[i].y]);
    }
    for (const n of selSubs()) for (const p of D.subway[n].samples) pts.push(p);
    return pts;
  }
  function fit(animate) {
    const [x0, y0, x1, y1] = extent(sel.length ? selPoints() : allPoints());
    const top = 64, bottom = sheetH() + 16, side = 24;
    let s = Math.min((W - side * 2) / (x1 - x0 || 1), (H - top - bottom) / (y1 - y0 || 1));
    s = Math.min(s, 12);
    if (!sel.length) fitScale = s;
    flyTo({ s, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 - (top - bottom) / 2 / s }, animate);
  }
  let anim = 0;
  function flyTo(t, animate) {
    cancelAnimationFrame(anim);
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!animate || reduce) { Object.assign(view, t); draw(true); return; }
    const from = { ...view }, t0 = performance.now(), dur = 420;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      view.s = Math.exp(Math.log(from.s) + (Math.log(t.s) - Math.log(from.s)) * e);
      view.cx = from.cx + (t.cx - from.cx) * e;
      view.cy = from.cy + (t.cy - from.cy) * e;
      draw(k === 1);
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  const toScreen = (x, y) => [(x - view.cx) * view.s + W / 2, (y - view.cy) * view.s + H / 2];
  const toMap = (sx, sy) => [(sx - W / 2) / view.s + view.cx, (sy - H / 2) / view.s + view.cy];
  const clampS = s => Math.max(fitScale * 0.5, Math.min(fitScale * 40, s));
  function zoomAt(sx, sy, factor) {
    const ns = clampS(view.s * factor);
    const [mx, my] = toMap(sx, sy);
    view.s = ns;
    view.cx = mx - (sx - W / 2) / ns;
    view.cy = my - (sy - H / 2) / ns;
  }

  // ---------- drawing ----------
  let pending = false, pendingHQ = false;
  function draw(hq) {
    pendingHQ = pendingHQ || hq;
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const q = pendingHQ; pendingHQ = false;
      render(q);
      clearTimeout(hiQ);
      if (!q) hiQ = setTimeout(() => render(true), 140);
    });
  }

  function render(hq) {
    if (!D) return;
    const s = view.s;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.sea;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR * s, 0, 0, DPR * s, (W / 2 - view.cx * s) * DPR, (H / 2 - view.cy * s) * DPR);
    const px = v => v / s;

    // shallow-water halo along the shore
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = COL.shallow; ctx.lineWidth = px(14); ctx.stroke(P.land);
    ctx.strokeStyle = 'rgba(234,246,252,0.9)'; ctx.lineWidth = px(6); ctx.stroke(P.land);

    // land with its soft shadow below
    ctx.save();
    if (hq) {
      ctx.shadowColor = 'rgba(70, 86, 98, 0.30)';
      ctx.shadowBlur = 10 * DPR; ctx.shadowOffsetX = 2.5 * DPR; ctx.shadowOffsetY = 5 * DPR;
    } else {
      ctx.save(); ctx.translate(px(2.5), px(5)); ctx.fillStyle = 'rgba(70, 86, 98, 0.14)'; ctx.fill(P.land, 'evenodd'); ctx.restore();
    }
    ctx.fillStyle = COL.land; ctx.fill(P.land, 'evenodd');
    ctx.restore();
    ctx.save();
    ctx.shadowColor = 'rgba(107, 98, 80, 0.32)'; ctx.shadowBlur = 1.5 * DPR; ctx.shadowOffsetX = 0.8 * DPR; ctx.shadowOffsetY = 1.6 * DPR;
    ctx.strokeStyle = COL.edge; ctx.lineWidth = px(0.8); ctx.stroke(P.land);
    ctx.restore();

    const any = sel.length > 0;
    const FAINT = 0.22;

    // buses that are not selected (faint while anything is selected)
    for (const b of D.buses) {
      if (isOn('bus:' + b.no)) continue;
      ctx.globalAlpha = any ? FAINT : 1;
      ctx.strokeStyle = COL.busInk; ctx.lineWidth = px(4.6); ctx.stroke(P.bus[b.no]);
      ctx.strokeStyle = COL.bus; ctx.lineWidth = px(3.2); ctx.stroke(P.bus[b.no]);
    }
    // subway: white casing + line colour
    for (const n of ['3', '2', '1']) {
      if (!P.sub[n]) continue;
      const on = isOn('sub:' + n);
      ctx.globalAlpha = any && !on ? FAINT : 1;
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = px(on ? 9.5 : 6.5); ctx.stroke(P.sub[n]);
      ctx.strokeStyle = COL.sub[n]; ctx.lineWidth = px(on ? 6.5 : 4.2); ctx.stroke(P.sub[n]);
    }
    ctx.globalAlpha = 1;
    // selected buses on top, bold
    for (const no of selBuses()) {
      const p = P.bus[no];
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = px(10); ctx.stroke(p);
      ctx.strokeStyle = COL.busInk; ctx.lineWidth = px(7.5); ctx.stroke(p);
      ctx.strokeStyle = COL.bus; ctx.lineWidth = px(5); ctx.stroke(p);
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawLabels();
  }

  // ---------- labels (screen space, greedy collision avoidance) ----------
  const boxes = [];
  const hit = (x0, y0, x1, y1) => {
    for (const b of boxes) if (x0 < b[2] && x1 > b[0] && y0 < b[3] && y1 > b[1]) return true;
    return false;
  };
  const textW = (t, size) => {
    let w = 0;
    for (const ch of t) w += /[ㄱ-힝]/.test(ch) ? size * 0.98 : (/[0-9]/.test(ch) ? size * 0.6 : size * 0.5);
    return w;
  };

  function drawLabels() {
    boxes.length = 0;
    const z = view.s / fitScale;
    const onScreen = (x, y, m = 40) => x > -m && y > -m && x < W + m && y < H + m;
    const buses = selBuses(), subs = selSubs(), any = sel.length > 0;

    // stops in play: those of the selected buses; with nothing selected, the commute stops
    // always and the others only once zoomed in
    let inPlay = null;
    if (buses.length) { inPlay = new Set(); for (const no of buses) for (const i of D.buses.find(b => b.no === no).stops) inPlay.add(i); }
    const vis = [];
    D.stops.forEach((st, i) => {
      if (any && !inPlay) return;                       // only subway selected
      if (inPlay && !inPlay.has(i)) return;
      if (!st.c) {                                      // stops I don't use: only on request
        if (!allStops) return;
        if (!inPlay && st.p >= 2 && z < 2) return;
        if (!inPlay && st.p === 1 && z < 3) return;
      }
      const [x, y] = toScreen(st.x, st.y);
      if (!onScreen(x, y)) return;
      vis.push({ st, x, y, i, rank: st.c ? 4 : st.p });
    });
    const markerR = v => v.st.c ? 5.5 : (v.st.p === 3 ? 4.6 : 3.2);
    for (const v of vis) { const r = markerR(v) + 1; boxes.push([v.x - r, v.y - r, v.x + r, v.y + r]); }

    // stop names: commute stops first (with what happens there), then termini, majors, rest
    const labelled = [];
    const placeLabel = (v, lines) => {
      const sizes = lines.map((t, k) => k === 0 ? (v.st.c ? 13 : v.st.p === 3 ? 12.5 : v.st.p === 2 ? 12 : 11) : 11);
      const w = Math.max(...lines.map((t, k) => textW(t, sizes[k])));
      const h = sizes.reduce((a, b) => a + b + 2, 0);
      const r = markerR(v);
      const spots = [
        [v.x + r + 4, v.y - h / 2], [v.x - r - 4 - w, v.y - h / 2],
        [v.x - w / 2, v.y - r - 4 - h], [v.x - w / 2, v.y + r + 4],
        [v.x + r + 2, v.y - r - h], [v.x - r - 2 - w, v.y - r - h],
        [v.x + r + 2, v.y + r], [v.x - r - 2 - w, v.y + r],
      ];
      if (v.st.c) {   // commute names may sit a little further out rather than vanish
        for (const d of [16, 30]) spots.push(
          [v.x + r + d, v.y - h / 2], [v.x - r - d - w, v.y - h / 2],
          [v.x - w / 2, v.y - r - d - h], [v.x - w / 2, v.y + r + d]);
      }
      for (const [lx, ly] of spots) {
        if (lx < 4 || lx + w > W - 4 || ly < 4) continue;
        if (hit(lx - 1, ly - 1, lx + w + 1, ly + h + 1)) continue;
        boxes.push([lx, ly, lx + w, ly + h]);
        labelled.push({ x: lx, y: ly, lines, sizes, st: v.st });
        return true;
      }
      return false;
    };
    const order = vis.slice().sort((a, b) => b.rank - a.rank || b.st.r.length - a.st.r.length);
    for (const v of order.filter(v => v.st.c)) placeLabel(v, [v.st.n, v.st.c]);

    // route-number badges along the lines (after commute labels so those always win)
    const badges = [];
    const badgeRun = (pts, text, kind, colour, spacing) => {
      let last = null;
      for (const p of pts) {
        const [x, y] = toScreen(p[0], p[1]);
        if (!onScreen(x, y, -12)) continue;
        if (last && Math.hypot(x - last[0], y - last[1]) < spacing) continue;
        const w = kind === 'sub' ? 22 : Math.max(26, textW(text, 12) + 12), h = kind === 'sub' ? 22 : 20;
        const b = [x - w / 2, y - h / 2, x + w / 2, y + h / 2];
        if (hit(b[0] - 2, b[1] - 2, b[2] + 2, b[3] + 2)) continue;
        boxes.push(b);
        badges.push({ x, y, w, h, text, kind, colour });
        last = [x, y];
      }
    };
    const busList = any ? D.buses.filter(b => buses.includes(b.no)) : D.buses;
    const subList = any ? subs : Object.keys(D.subway);
    for (const n of subList) badgeRun(D.subway[n].samples, n, 'sub', COL.sub[n], any ? 200 : 260);
    for (const b of busList) badgeRun(b.samples, b.no, 'bus', COL.bus, any ? 170 : 210);

    for (const v of order.filter(v => !v.st.c)) {
      if (inPlay && v.st.p === 1 && z < 1.6 && buses.length > 0) continue;
      placeLabel(v, [v.st.n]);
    }

    // paint: markers, badges, text
    for (const v of vis) {
      const r = markerR(v);
      ctx.beginPath(); ctx.arc(v.x, v.y, r, 0, Math.PI * 2);
      if (v.st.c) {
        ctx.fillStyle = COL.commute; ctx.fill();
        ctx.lineWidth = 2.2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      } else {
        ctx.fillStyle = v.st.p === 3 ? COL.busInk : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = v.st.p === 3 ? 2 : 1.6;
        ctx.strokeStyle = v.st.p === 3 ? '#FFFFFF' : COL.busInk; ctx.stroke();
      }
    }
    for (const b of badges) {
      ctx.beginPath();
      if (b.kind === 'sub') {
        ctx.arc(b.x, b.y, 11, 0, Math.PI * 2);
        ctx.fillStyle = b.colour; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
        ctx.fillStyle = '#FFFFFF'; ctx.font = `700 12.5px ${FONT}`;
      } else {
        roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 6);
        ctx.fillStyle = COL.bus; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = COL.busInk; ctx.stroke();
        ctx.fillStyle = COL.busText; ctx.font = `700 12px ${FONT}`;
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.text, b.x, b.y + 0.5);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const l of labelled) {
      let y = l.y;
      l.lines.forEach((t, k) => {
        const size = l.sizes[k];
        y += (size + 2) / 2;
        const strong = k === 0 && (l.st.c || l.st.p >= 2);
        ctx.font = `${k === 0 ? (strong ? 700 : 500) : 600} ${size}px ${FONT}`;
        ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(255, 253, 247, 0.96)';
        ctx.strokeText(t, l.x, y);
        ctx.fillStyle = k === 1 ? COL.commute : (l.st.p === 1 && !l.st.c ? '#57534A' : COL.label);
        ctx.fillText(t, l.x, y);
        y += (size + 2) / 2;
      });
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- chips, selection and the stop list ----------
  const chipsEl = document.getElementById('chips');
  function buildChips() {
    const mk = (label, key, swatch, isBus) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.key = key;
      b.setAttribute('aria-pressed', 'false');
      const sw = document.createElement('span');
      sw.className = 'sw' + (isBus ? ' bus' : '');
      if (swatch) sw.style.background = swatch;
      b.append(sw, document.createTextNode(label));
      b.addEventListener('click', () => toggle(key));
      chipsEl.append(b);
      return b;
    };
    for (const n of ['1', '2', '3']) if (D.subway[n]) mk(n + '호선', 'sub:' + n, COL.sub[n], false);
    D.buses.forEach((b, i) => { const c = mk(b.no, 'bus:' + b.no, null, true); if (i === 0) c.classList.add('sep'); });
  }
  function toggle(key) {
    const i = sel.indexOf(key);
    if (i >= 0) sel.splice(i, 1); else { sel.push(key); if (sheetState === 'hidden') sheetState = 'normal'; }
    changed();
  }
  function clearAll() { sel.length = 0; changed(); }
  function changed() {
    for (const c of chipsEl.children) c.setAttribute('aria-pressed', String(isOn(c.dataset.key)));
    renderDetail();
    requestAnimationFrame(() => fit(true));
  }
  function renderDetail() {
    const det = document.getElementById('detail');
    const hint = document.getElementById('hint');
    const list = document.getElementById('d-stops');
    list.textContent = '';
    const key = focusKey();
    const sheet = document.querySelector('.sheet');
    if (!key) { det.hidden = true; hint.hidden = false; sheet.classList.remove('full'); sheetState = 'normal'; draw(true); return; }
    det.hidden = false; hint.hidden = true;
    sheet.classList.toggle('full', sheetState === 'full' && key.startsWith('bus:'));
    list.hidden = sheetState === 'hidden';
    document.getElementById('grab').setAttribute('aria-label',
      sheetState === 'hidden' ? '정류장 목록 펼치기' : (sheetState === 'full' ? '정류장 목록 줄이기' : '정류장 목록 전체 화면'));
    const badge = document.getElementById('d-badge');
    const others = sel.length > 1 ? ` · 함께 선택 ${sel.length - 1}개` : '';
    if (key.startsWith('sub:')) {
      const n = key.slice(4);
      badge.className = 'badge sub'; badge.style.background = COL.sub[n]; badge.textContent = n;
      document.getElementById('d-title').textContent = `부산 도시철도 ${n}호선`;
      document.getElementById('d-sub').textContent = D.subway[n].ends + others;
      list.hidden = true;
      return;
    }
    const b = D.buses.find(x => x.no === key.slice(4));
    badge.className = 'badge bus'; badge.style.background = ''; badge.textContent = b.no;
    document.getElementById('d-title').textContent = `${b.from} ↔ ${b.turn}`;
    document.getElementById('d-sub').textContent = `정류장 ${b.stops.length}곳 · 한 바퀴 ${b.km} km` + others;
    b.stops.forEach((i, k) => {
      const st = D.stops[i];
      const li = document.createElement('li');
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'stop-row' + (st.p >= 2 || st.c ? ' major' : '') + (st.p === 3 ? ' end' : '') + (st.c ? ' commute' : '');
      const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = k + 1;
      const dot = document.createElement('span'); dot.className = 'dot';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = st.n;
      const tag = (text, cls) => { const t = document.createElement('span'); t.className = 'tag' + (cls ? ' ' + cls : ''); t.textContent = text; name.append(t); };
      if (k === 0) tag('기점');
      else if (st.n === b.turn) tag('회차');
      if (st.c) tag(st.c, 'c');
      const xf = st.r.filter(r => r !== b.no);
      if (xf.length) { const t = document.createElement('span'); t.className = 'xfer'; t.textContent = '+ ' + xf.join(', '); name.append(t); }
      row.append(idx, dot, name);
      row.addEventListener('click', () => {
        if (performance.now() - swipedAt < 400) return;
        if (sheetState === 'full') setSheet('normal');
        const s = Math.max(view.s, fitScale * 4);
        flyTo({ cx: st.x, cy: st.y + (sheetH() - 64) / 2 / s, s }, true);
      });
      li.append(row);
      list.append(li);
    });
  }
  function setSheet(v) {
    if (sheetState === v) return;
    sheetState = v;
    renderDetail();
  }
  // one step per swipe: hidden <-> normal <-> full
  const swipe = dir => {
    swipedAt = performance.now();
    if (dir < 0) setSheet(sheetState === 'hidden' ? 'normal' : 'full');
    else setSheet(sheetState === 'full' ? 'normal' : 'hidden');
  };
  let swipedAt = 0;   // a swipe ends with a click; ignore that click
  document.getElementById('d-close').addEventListener('click', clearAll);
  document.getElementById('grab').addEventListener('click', () => {
    if (performance.now() - swipedAt < 400) return;
    setSheet(sheetState === 'normal' ? 'full' : 'normal');
  });

  (() => {
    const list = document.getElementById('d-stops');
    // handle, header, and the list while it is half height: pointer swipes
    let y0 = null, id = null;
    const down = e => {
      if (e.target.closest('.close')) return;
      if (e.currentTarget === list && sheetState === 'full') return;   // full list scrolls natively
      y0 = e.clientY; id = e.pointerId;
      try { e.currentTarget.setPointerCapture(id); } catch (err) { /* pointer already gone */ }
    };
    const up = e => {
      if (y0 === null || e.pointerId !== id) return;
      const dy = e.clientY - y0; y0 = null;
      if (Math.abs(dy) > 30) swipe(dy);
    };
    for (const t of [document.getElementById('grab'), document.getElementById('detail-head'), list]) {
      t.addEventListener('pointerdown', down);
      t.addEventListener('pointerup', up);
      t.addEventListener('pointercancel', () => { y0 = null; });
    }
    // full-screen list: a pull down from the top shrinks it back
    let ty = null;
    list.addEventListener('touchstart', e => { ty = sheetState === 'full' && list.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
    list.addEventListener('touchend', e => {
      if (ty === null) return;
      if (e.changedTouches[0].clientY - ty > 50 && list.scrollTop <= 0) swipe(1);
      ty = null;
    }, { passive: true });
    // mouse wheel on the half-height list opens it full screen
    list.addEventListener('wheel', e => {
      if (sheetState === 'normal' && e.deltaY > 0) { e.preventDefault(); swipe(-1); }
      else if (sheetState === 'full' && e.deltaY < 0 && list.scrollTop <= 0) { e.preventDefault(); swipe(1); }
    }, { passive: false });
  })();

  document.getElementById('zoom-in').addEventListener('click', () => flyTo({ s: clampS(view.s * 1.6), cx: view.cx, cy: view.cy }, true));
  document.getElementById('zoom-out').addEventListener('click', () => flyTo({ s: clampS(view.s / 1.6), cx: view.cx, cy: view.cy }, true));
  document.getElementById('zoom-fit').addEventListener('click', () => fit(true));
  document.getElementById('all-stops').addEventListener('click', e => {
    allStops = !allStops;
    e.currentTarget.setAttribute('aria-pressed', String(allStops));
    draw(true);
  });

  // ---------- gestures ----------
  const ptrs = new Map();
  let gesture = null, moved = false, lastTap = 0;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
    moved = false;
    startGesture();
    cancelAnimationFrame(anim);
  });
  canvas.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
    const g = gesture; if (!g) return;
    const pts = [...ptrs.values()];
    const c = centroid(pts), d = spread(pts);
    if (Math.hypot(c[0] - g.c[0], c[1] - g.c[1]) > 4 || Math.abs(d - g.d) > 4) moved = true;
    if (!moved) return;
    canvas.classList.add('dragging');
    const ns = pts.length > 1 && g.d > 0 ? clampS(g.s * d / g.d) : g.s;
    view.s = ns;
    view.cx = g.m[0] - (c[0] - W / 2) / ns;
    view.cy = g.m[1] - (c[1] - H / 2) / ns;
    draw(false);
  });
  const end = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    canvas.classList.remove('dragging');
    if (ptrs.size) { startGesture(); return; }
    gesture = null;
    if (!moved && e.type === 'pointerup') {
      const now = performance.now();
      if (now - lastTap < 300) { lastTap = 0; zoomTo(e.offsetX, e.offsetY, 2); return; }
      lastTap = now;
      tap(e.offsetX, e.offsetY);
    }
    draw(true);
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  function startGesture() {
    const pts = [...ptrs.values()];
    const c = centroid(pts);
    gesture = { c, d: spread(pts), s: view.s, m: toMap(c[0], c[1]) };
  }
  const centroid = pts => [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
  const spread = pts => pts.length < 2 ? 0 : Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
  function zoomTo(sx, sy, f) {
    const s = clampS(view.s * f);
    const [mx, my] = toMap(sx, sy);
    flyTo({ s, cx: mx - (sx - W / 2) / s, cy: my - (sy - H / 2) / s }, true);
  }
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)));
    draw(false);
  }, { passive: false });

  function tap(sx, sy) {
    // a line under the finger toggles that route; empty map does nothing
    ctx.setTransform(DPR * view.s, 0, 0, DPR * view.s, (W / 2 - view.cx * view.s) * DPR, (H / 2 - view.cy * view.s) * DPR);
    ctx.lineWidth = 18 / view.s;
    const X = sx * DPR, Y = sy * DPR;
    // selected lines first, so a tap on a highlighted line turns it off
    for (const no of selBuses()) if (ctx.isPointInStroke(P.bus[no], X, Y)) { toggle('bus:' + no); return; }
    for (const n of ['1', '2', '3']) if (P.sub[n] && ctx.isPointInStroke(P.sub[n], X, Y)) { toggle('sub:' + n); return; }
    for (const b of D.buses) if (ctx.isPointInStroke(P.bus[b.no], X, Y)) { toggle('bus:' + b.no); return; }
  }

  window.addEventListener('resize', () => { if (!D) return; resize(); draw(true); });
  document.fonts && document.fonts.ready.then(() => draw(true));
})();
</script>
