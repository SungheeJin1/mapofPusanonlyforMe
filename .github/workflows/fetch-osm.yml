# Downloads the OpenStreetMap data for the map (coastline, subway 1-3, bus routes)
# and commits it as data/busan_osm.json. Runs only on this branch, when the
# query or this workflow changes, or by hand.
name: fetch-osm
on:
  push:
    branches: [claude/magical-franklin-tfvexp]
    paths: [scripts/overpass_query.txt, scripts/overpass_bus_list.txt, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p data
          fetch() {  # fetch <query file> <output file>
          for i in 1 2 3; do
            for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              echo "trying $ep"
              if curl -sS -f -m 300 "$ep" --data-urlencode "data@$1" -o "$2" \
                 && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=len(d['elements']); print(n,'elements'); sys.exit(n==0)" "$2"; then
                return 0
              fi
            done
            sleep 60
          done
          return 1
          }
          fetch scripts/overpass_query.txt data/busan_osm.json
          fetch scripts/overpass_bus_list.txt data/bus_list.json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/busan_osm.json data/bus_list.json
          git commit -m "Add OSM data for Busan map (via Overpass)" || exit 0
          # the branch may have moved while the queries ran
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
