# Downloads the data for the map and commits it under data/:
#  - OpenStreetMap coastline, rivers, subway 1-3, bus routes, roads (Overpass)
#  - bus stop sequences from the Busan BIMS open API, if the BUSAN_BIMS_KEY secret is set. Runs only on this branch, when the
# query or this workflow changes, or by hand.
name: fetch-osm
on:
  push:
    branches: [claude/magical-franklin-tfvexp]
    paths: [scripts/overpass_*.txt, scripts/fetch_bus_stops.py, scripts/compact_roads.py, .github/fetch-trigger, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Query Overpass
        run: |
          mkdir -p data
          fetch() {  # fetch <query file> <output file>
          for i in 1 2 3; do
            for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              echo "trying $ep"
              if curl -sS -f -m 300 -A "busan-map-builder/1.0 (GitHub Actions)" "$ep" --data-urlencode "data@$1" -o "$2" \
                 && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=len(d['elements']); print(n,'elements'); sys.exit(n==0)" "$2"; then
                return 0
              fi
            done
            sleep 60
          done
          return 1
          }
          # only re-download what is missing or whose query changed in this push
          stale() { [ ! -f "$1" ] || ! git diff --quiet HEAD~1 -- "${@:2}"; }
          if stale data/busan_osm.json scripts/overpass_query.txt; then
            fetch scripts/overpass_query.txt data/busan_osm.json
          fi
          if stale data/bus_list.json scripts/overpass_bus_list.txt; then
            fetch scripts/overpass_bus_list.txt data/bus_list.json
          fi
          if stale data/roads.json.gz scripts/overpass_roads.txt scripts/compact_roads.py; then
            fetch scripts/overpass_roads.txt /tmp/roads.json
            python3 scripts/compact_roads.py /tmp/roads.json data/roads.json.gz
          fi
      - name: Bus stops (Busan BIMS API)
        env:
          BUSAN_BIMS_KEY: ${{ secrets.BUSAN_BIMS_KEY }}
        run: |
          if [ -z "$BUSAN_BIMS_KEY" ]; then echo "BUSAN_BIMS_KEY secret not set; skipping"; exit 0; fi
          python3 scripts/fetch_bus_stops.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add OSM data for Busan map (via Overpass)" || exit 0
          # the branch may have moved while the queries ran
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
