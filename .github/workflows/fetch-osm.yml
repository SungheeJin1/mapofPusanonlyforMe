# Downloads the OpenStreetMap data for the map (coastline, subway 1-3, bus routes)
# and commits it as data/busan_osm.json. Runs only on this branch, when the
# query or this workflow changes, or by hand.
name: fetch-osm
on:
  push:
    branches: [claude/magical-franklin-tfvexp]
    paths: [scripts/overpass_query.txt, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p data
          for i in 1 2 3; do
            for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              echo "trying $ep"
              if curl -sS -f -m 300 "$ep" --data-urlencode "data@scripts/overpass_query.txt" -o data/busan_osm.json \
                 && python3 -c "import json,sys; d=json.load(open('data/busan_osm.json')); n=len(d['elements']); print(n,'elements'); sys.exit(n==0)"; then
                exit 0
              fi
            done
            sleep 60
          done
          exit 1
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/busan_osm.json
          git commit -m "Add OSM data for Busan map (via Overpass)" || exit 0
          git push
